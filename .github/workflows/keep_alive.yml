name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier spin down (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          curl -f -s -S --max-time 60 https://f1-telemetry-api.onrender.com/health || echo "Ping dispatched (server waking up if asleep)"
